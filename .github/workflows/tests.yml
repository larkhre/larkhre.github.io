name: tests

on:
  push:
  pull_request:

jobs:
  deux-moteurs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Les programmes du livre, sur le moteur Python et le moteur du playground
        run: python3 tests/run_tests.py
